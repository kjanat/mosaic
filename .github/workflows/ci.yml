name: CI
run-name: >-
  ${{ format('{0}: {1}',
    case(github.event_name == 'pull_request', format('PR #{0}', github.event.pull_request.number), github.ref_name),
    case(github.event_name == 'pull_request', github.event.pull_request.title, github.event.head_commit.message)
  ) }} by @${{ github.actor }}

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", ".dprint.jsonc", "tombi.toml"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", ".dprint.jsonc", "tombi.toml"]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · build · test · doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tombi-toml/setup-tombi@v1
      - uses: kjanat/install-dprint@v1
      - uses: kjanat/install-shfmt@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: dprint fmt --diff --allow-no-files --skip-stable-format --fail-on-change

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace

      - name: Upload debug binaries
        uses: actions/upload-artifact@v7
        with:
          name: mosaic-binaries-linux-x86_64-${{ github.sha }}
          path: |
            target/debug/mos
            target/debug/mos-lsp
          retention-days: 2
          if-no-files-found: error

      - name: doc
        run: cargo doc --workspace --no-deps

  msrv:
    name: build on MSRV
    runs-on: ubuntu-latest
    env: { RUSTUP_TOOLCHAIN: 1.95 }
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ env.RUSTUP_TOOLCHAIN }}" }

      - uses: Swatinem/rust-cache@v2
        with: { key: msrv }

      - name: build
        run: cargo build --workspace --all-targets
