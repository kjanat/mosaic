name: docs
run-name: "${{ format('docs: {0}', case(github.event_name == 'workflow_dispatch', 'manual dispatch', github.event.head_commit.message)) }} by @${{ github.actor }}"

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", ".dprint.jsonc", "tombi.toml"]
  workflow_dispatch:

permissions: read-all

concurrency: { group: pages, cancel-in-progress: true }

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with: { key: docs }

      - name: cargo doc
        run: cargo dw

      - name: Write crate index
        env: { FAVICON: "${{ vars.FAVICON }}" }
        run: |
          cat <<-HTML > target/doc/index.html
          	<!DOCTYPE html>
          	<html lang="en">
          	<head>
          	  <meta charset="utf-8">
          	  <meta name="viewport" content="width=device-width, initial-scale=1">
          	  <link rel="stylesheet" href="index.css">
          	  <link rel="icon" type="image/svg+xml" href="${FAVICON}">
          	  <title>Mosaic API docs</title>
          	</head>
          	<body>
          	  <h1>Mosaic API docs</h1>
          	  <ul>
          	$(cd target/doc && for d in */index.html; do c=${d%/index.html}; n=${c//_/-}; printf '    <li><a href="%s">%s</a></li>\n' "$d" "$n"; done)
          	  </ul>
          	</body>
          	</html>
          HTML

          cat <<-CSS > target/doc/index.css
          	:root { color-scheme: light dark; }
          	body { font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
          	      max-width: 720px; margin: 3rem auto; padding: 0 1.25rem; }
          	h1 { font-weight: 600; font-size: 1.6rem; margin: 0 0 1.5rem; }
          	ul { list-style: none; padding: 0; }
          	li { padding: .45rem 0; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
          	li:last-child { border-bottom: none; }
          	a { color: #2563eb; text-decoration: none; font-weight: 500; }
          	a:hover { text-decoration: underline; }
          	@media (prefers-color-scheme: dark) { a { color: #60a5fa; } }
          CSS

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with: { path: target/doc }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps: [{ uses: actions/deploy-pages@v5, id: deployment }]
