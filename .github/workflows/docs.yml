name: Docs
run-name: "${{ format('docs: {0}', case(github.event_name == 'workflow_dispatch', 'manual dispatch', github.event.head_commit.message)) }} by @${{ github.actor }}"

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", ".dprint.jsonc", "tombi.toml"]
  workflow_dispatch:

defaults: { run: { shell: pwsh } }
permissions: { contents: read }

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with: { key: docs }

      - name: cargo doc
        run: cargo dw

      - name: Copy docs assets
        env: { TARGET: target/doc/assets, INPUT: design/A4.svg }
        run: |
          New-Item -ItemType Directory -Force -Path $env:TARGET | Out-Null
          Copy-Item -LiteralPath $env:INPUT -Destination $env:TARGET

      - name: Write crate index
        run: |
          $docDir = 'target/doc'
          # One <li> per subdirectory that has its own index.html (a built crate),
          # sorted, with `_` shown as `-` to match crate display names.
          $list = (Get-ChildItem -LiteralPath $docDir -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'index.html') } |
            Sort-Object Name |
            ForEach-Object { "    <li><a href=""$($_.Name)/index.html"">$($_.Name -replace '_', '-')</a></li>" }) -join "`n"

          @"
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <link rel="icon" type="image/svg+xml" href="assets/A4.svg">
              <title>Mosaic API docs</title>
              <style>
                :root { color-scheme: light dark; }
                body { font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
                       max-width: 720px; margin: 3rem auto; padding: 0 1.25rem; }
                h1 { font-weight: 600; font-size: 1.6rem; margin: 0 0 1.5rem; }
                ul { list-style: none; padding: 0; }
                li { padding: .45rem 0; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
                li:last-child { border-bottom: none; }
                a { color: #2563eb; text-decoration: none; font-weight: 500; }
                a:hover { text-decoration: underline; }
                footer { margin-top: 2rem; font-size: .95rem; }
                @media (prefers-color-scheme: dark) { a { color: #60a5fa; } }
              </style>
            </head>
            <body>
              <h1>Mosaic API docs</h1>
              <ul>
          $list
              </ul>
              <footer><a href="https://github.com/kjanat/mosaic">Source on GitHub</a></footer>
            </body>
          </html>
          "@ | Set-Content -LiteralPath "$docDir/index.html" -Encoding utf8

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with: { path: target/doc }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps: [{ uses: actions/deploy-pages@v5, id: deployment }]
