name: Docs
run-name: "${{ format('docs: {0}', case(github.event_name == 'workflow_dispatch', 'manual dispatch', github.event.head_commit.message)) }} by @${{ github.actor }}"

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", ".dprint.jsonc", "tombi.toml"]
  workflow_dispatch:

defaults: { run: { shell: pwsh } }
permissions: { contents: read }

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  TARGET_DIR: target/doc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: docs }

      - uses: ./.github/actions/pages
        with: { dir: "${{ env.TARGET_DIR }}" }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: "${{ env.TARGET_DIR }}" }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps: [{ uses: actions/deploy-pages@v5, id: deployment }]
