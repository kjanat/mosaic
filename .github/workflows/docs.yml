name: docs

run-name: >-
  ${{ format('docs: {0}',
    case(github.event_name == 'workflow_dispatch', 'manual dispatch', github.event.head_commit.message)
  ) }} by @${{ github.actor }}

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", ".dprint.jsonc", "tombi.toml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with: { key: docs }

      - name: cargo doc
        run: cargo doc --workspace --no-deps

      - name: Write crate index
        run: |
          cat > target/doc/index.html <<HTML
          <!doctype html>
          <title>Mosaic API docs</title>
          <h1>Mosaic API docs</h1>
            <ul>
          $(cd target/doc && for d in */index.html; do c=${d%/index.html}; printf '    <li><a href="%s/">%s</a></li>\n' "$c" "$c"; done)
            </ul>
          HTML

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with: { path: target/doc }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps: [{ uses: actions/deploy-pages@v5, id: deployment }]
