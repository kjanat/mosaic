# Configuration for Clippy. The lint *enablement* lives in
# `[workspace.lints.clippy]` in Cargo.toml; this file only tunes the
# knobs of lints that are already enabled.
#
# - https://doc.rust-lang.org/clippy/configuration.html
# - https://rust-lang.github.io/rust-clippy/master/index.html#Configuration

# Match the workspace MSRV. Lints that gate suggestions on the
# minimum-supported Rust version (e.g. `manual_let_else`) honour this.
msrv = "1.95"

# We're pre-1.0 (version 0.0.0). Let lints suggest API-breaking
# improvements rather than skipping them.
avoid-breaking-exported-api = false

# `unwrap_used`, `expect_used`, `dbg_macro`, `print_stdout`,
# `print_stderr` are bans we want in production code; tests routinely
# need them, so keep `#[test]` blocks unaffected.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Extend the default ident list for `doc_markdown` with technical
# names that appear throughout `manifest.md` and crate docs. The
# `".."` token preserves the built-in defaults rather than replacing
# them.
doc-valid-idents = [
  "..",
  "AsciiMath",
  "BibLaTeX",
  "BibTeX",
  "Biber",
  "CommonMark",
  "EPUB",
  "HarfBuzz",
  "LaTeX",
  "Mosaic",
  "OpenType",
  "PostScript",
  "Typst",
  "Unicode",
]
