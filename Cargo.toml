[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version      = "0.0.0"
edition      = "2024"
rust-version = "1.95"
license      = "MIT"
repository   = "https://github.com/kjanat/mosaic"
authors      = ["Mosaic contributors"]

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"
rust_2018_idioms              = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Enable two large opinion sets; negative priority lets individual
# `allow`s below override specific lints inside them.
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }

# Specific elevations beyond the defaults.
dbg_macro          = "warn"
todo               = "warn"
unimplemented      = "allow"   # stubs use this on purpose; revisit per-crate later
unwrap_used        = "warn"
expect_used        = "warn"

# Pedantic / nursery lints that are noise more than signal here.
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
missing_const_for_fn    = "allow"   # nursery: many stubs would qualify, then stop qualifying once filled in

[workspace.dependencies]
mosaic-core     = { path = "crates/mosaic-core",     version = "0.0.0" }
mosaic-parse    = { path = "crates/mosaic-parse",    version = "0.0.0" }
mosaic-eval     = { path = "crates/mosaic-eval",     version = "0.0.0" }
mosaic-layout   = { path = "crates/mosaic-layout",   version = "0.0.0" }
mosaic-pdf      = { path = "crates/mosaic-pdf",      version = "0.0.0" }
mosaic-html     = { path = "crates/mosaic-html",     version = "0.0.0" }
mosaic-fonts    = { path = "crates/mosaic-fonts",    version = "0.0.0" }
mosaic-bib      = { path = "crates/mosaic-bib",      version = "0.0.0" }
mosaic-cache    = { path = "crates/mosaic-cache",    version = "0.0.0" }
mosaic-lsp      = { path = "crates/mosaic-lsp",      version = "0.0.0" }
mosaic-packages = { path = "crates/mosaic-packages", version = "0.0.0" }

clap        = { version = "4.5", features = ["derive"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
toml        = "0.9"

[profile.release]
lto       = "thin"
codegen-units = 1
