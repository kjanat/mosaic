[package]
name                 = "pdf-base14-metrics"
version.workspace    = true
edition.workspace    = true
rust-version         = "1.85"
description          = "Pre-parsed Adobe Core 14 PDF font metrics (Helvetica, Times, Courier, Symbol, ZapfDingbats) baked into `&'static FontMetrics` constants at compile time."
readme               = "README.md"
homepage.workspace   = true
repository.workspace = true
# Both components are SPDX-registered identifiers (v3.6+):
# - MIT: our own code. License text in `LICENSE-MIT`.
# - APAFML: Adobe PostScript AFM License; the Core 14 AFM data (`data/afm/*.afm`).
#   License text in `LICENSE-APAFML`.
#
# The Adobe Glyph List data (`data/agl/glyphlist.txt`, BSD-3-Clause)
# is kept in the repo for the `winansi_vendor` integration test but is
# NOT in the `include` manifest below: it does not ship to crates.io.
# The build script no longer reads it; the byte→`char` `WinAnsi` map
# is hand-transcribed from PDF 1.7 Annex D.2 into
# `src/winansi_char_map.rs`.
license              = "MIT AND APAFML"
keywords.workspace   = true
categories.workspace = true
# Vendored-data crate: publish only runtime AFM data and tests that work without
# the AGL test oracle (`data/agl/**`, `LICENSE-AGL`, `tests/winansi_vendor.rs`).
include              = [
  "/LICENSE",
  "/LICENSE-APAFML",
  "/LICENSE-MIT",
  "/README.md",
  "/build.rs",
  "/data/afm",
  "/src",
  "/tests/baked.rs",
]

[dependencies]
adobe-font-metrics.workspace = true

[build-dependencies]
adobe-font-metrics.workspace = true

[lints]
workspace = true
