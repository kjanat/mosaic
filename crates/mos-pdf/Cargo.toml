[package]
name                   = "mos-pdf"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "PDF backend for Mosaic (manifest §21.1)."
readme.workspace       = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
mos-core   = { workspace = true }
mos-fonts  = { workspace = true }
mos-layout = { workspace = true }

# FlateDecode compression for raster image XObject streams. Already in
# the dependency graph via `image` → `png`; pulling it in directly
# keeps the emit path's imports honest.
flate2     = { workspace = true }
pdf-writer = { workspace = true }
# Used through `mos_fonts::subset` for the GlyphRemapper type only
# (the actual subsetting happens inside mos-fonts). Direct dep so
# the type appears in the public emit-side API without re-exporting
# the whole crate through mos-fonts.
subsetter  = { workspace = true }

[dev-dependencies]
# `lopdf` only used in integration tests to parse the PDFs we produce
# and assert the encoding/content-stream round-trips.
lopdf = { workspace = true }

[lints]
workspace = true
