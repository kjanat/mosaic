[package]
name                   = "mosaic-pdf"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "PDF backend for Mosaic (manifest §21.1)."
readme.workspace       = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
mosaic-core   = { workspace = true }
mosaic-fonts  = { workspace = true }
mosaic-layout = { workspace = true }

pdf-writer = { workspace = true }
# Used through `mosaic_fonts::subset` for the GlyphRemapper type only
# (the actual subsetting happens inside mosaic-fonts). Direct dep so
# the type appears in the public emit-side API without re-exporting
# the whole crate through mosaic-fonts.
subsetter = "0.2"

[dev-dependencies]
# `lopdf` only used in integration tests to parse the PDFs we produce
# and assert the encoding/content-stream round-trips.
lopdf = { workspace = true }

[lints]
workspace = true
