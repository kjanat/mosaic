[package]
name                   = "mos-fonts"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Font discovery, shaping, and metrics for Mosaic (manifest §22.1)."
readme                 = "README.md"
homepage.workspace     = true
repository.workspace   = true
# Engine code is MIT (workspace default); the bundled Noto Sans data under
# `data/` is OFL-1.1. The crate-level expression combines both per SPDX.
license                = "MIT AND OFL-1.1"
keywords.workspace     = true
categories.workspace   = true
# Cargo's default packaging excludes binary files; explicitly include
# the bundled font TTFs, the OFL license, and the SOURCES manifest so
# they ship in the crates.io tarball.
include                = [
  "/LICENSE*",
  "/README.md",
  "/build.rs",
  "/data/LICENSE-Noto-Sans",
  "/data/NotoSans-Bold.ttf",
  "/data/NotoSans-BoldItalic.ttf",
  "/data/NotoSans-Italic.ttf",
  "/data/NotoSans-Regular.ttf",
  "/data/NotoSansMath-Regular.ttf",
  "/data/NotoSansMono-Regular.ttf",
  "/data/SOURCES.md",
  "/src",
  "/tests",
]

[dependencies]
mos-core.workspace              = true
pdf-base14-metrics.workspace    = true
rustybuzz.workspace             = true
subsetter.workspace             = true
ttf-parser.workspace            = true
unicode-normalization.workspace = true

[lints]
workspace = true
