#:schema https://gist.githubusercontent.com/kjanat/1172d9d2d6dbe7c6d9983aaabef2eea5/raw/cargo-config.bundle.json

# Cargo configuration for the Mosaic workspace.
# See: https://doc.rust-lang.org/cargo/reference/config.html

[alias]
# Release flavours.
br = "build --release"

# Workspace shortcuts
# (built-in single-letter aliases b/c/d/t/r/rm can't be redefined per the alias schema,
# so the workspace flavours get short two-letter names).
bw  = "build --workspace"
bwa = "build --workspace --all-targets"
cw  = "check --workspace --all-targets"
da  = "doc --workspace --no-deps --message-format json --quiet --all-features --document-private-items --bins --examples"
dw  = "doc --workspace --no-deps"
dwn = "--config .cargo/nightly.toml doc"                                                                                   # Run: rustup run nightly -- cargo dwn
rr  = "run --release"
tw  = "test --workspace"

cov  = "llvm-cov --summary-only --no-clean"
lint = "clippy --workspace --all-targets --all-features -- -D warnings -D clippy::all"

# Run the `mos` CLI from the workspace.
mos   = "run --release -q -p mos --"
mosls = "run --release -q -p mos-lsp --"

# Install the workspace `mos`/`mos-lsp` CLI binary locally.
mosi   = "install --path=crates/mos --bin=mos --force"
mosils = "install --path=crates/mos-lsp --bin=mos-lsp --force"
