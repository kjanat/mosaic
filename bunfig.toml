# Scope `bun test` discovery to the bun workspace member that actually has
# JS tests. Without this, `bun test` (run by the project `runner`) recurses
# the whole tree and picks up `crates/zed-mosaic/grammars/…` — a gitignored
# copy of the grammar that Zed repopulates on dev-install — which errors
# because `tree-sitter` isn't resolvable from that vendored tree.
[test]
root = "crates/tree-sitter-mosaic"
